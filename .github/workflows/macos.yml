name: go-macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: cloudengio/.github/.github/workflows/go-test-multimod.yml@main
    with:
      #runner: | # use for self-hosted runners
      #  [ "self-hosted", "mm1-vm1" ]
      runner: |
        # [ "macos-latest" ]
        [ "self-hosted", "macos", "arm64" ]
      go-versions: |
        [ "1.26.x" ]
      with-webapp: true
      pebble-version: "v2.8.0"

